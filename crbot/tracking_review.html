<!doctype html><html lang="zh"><meta charset="utf-8"><title>跟随训练标注</title>
<style>body{font:16px system-ui;background:#f3f6fb;color:#23324c;margin:24px}button,input,select{font:inherit;padding:9px;margin:5px;border:1px solid #cbd5e1;border-radius:7px}canvas{background:white;max-height:75vh;max-width:65vw;touch-action:none}main{display:flex;gap:24px}aside{width:340px}button{cursor:pointer}#msg{color:#315fa3}</style>
<style>dialog{border:0;border-radius:16px;width:min(960px,88vw);max-height:85vh;padding:20px}dialog::backdrop{background:#18283d99}.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;overflow:auto;max-height:64vh}.card-choice{display:flex;flex-direction:column;align-items:center;background:#f4f7fc;margin:0;min-height:150px}.card-choice img{width:72px;height:86px;object-fit:contain}.card-choice small{font-size:12px;color:#667085}.card-choice.selected{border:2px solid #2563eb;background:#eaf2ff}#selected-card{display:flex;align-items:center;gap:12px;width:100%;background:white}#selected-card img{width:50px;height:60px;object-fit:contain}</style>
<h2>连续画面中的同一个单位，请始终使用同一编号</h2><p>拖动框选身体，点击兵种图片选择兵种，再填写阵营和单位编号。只标自己能确认的单位；不确定的帧不要确认。新下出的同类兵种必须使用新编号。</p>
<button onclick="move(-1)">上一帧</button><button onclick="move(1)">下一帧</button><button onclick="copyPrevious()">复制上一帧标注（需核对）</button><button onclick="download()">保存标注文件</button><input type="file" accept=".jsonl" onchange="restore(this)"><span id="info"></span>
<main><canvas id="canvas"></canvas><aside><label>单位编号<input id="uid" value="1"></label><label>兵种</label><input id="card" type="hidden" value="hog_rider"><button id="selected-card" onclick="openCards()"></button><select id="side"><option value="-1">敌方</option><option value="1">我方</option></select><button onclick="clearUnits()">清空本帧标注</button><p><input id="reviewed" type="checkbox" onchange="rows[index].reviewed=this.checked">我已核对本帧身份</p><p id="msg"></p><pre id="units"></pre></aside></main>
<dialog id="card-dialog"><h3>点击图片选择兵种</h3><input id="card-search" placeholder="搜索中文名称或英文名称" oninput="showCards()"><button onclick="el('card-dialog').close()">关闭</button><p id="card-count"></p><div id="card-grid" class="card-grid"></div></dialog>
<script>const rows=__DATA__;let index=0,start=null,loaded=-1;const c=document.getElementById('canvas'),ctx=c.getContext('2d'),img=new Image();
const el=id=>document.getElementById(id);img.onload=()=>{loaded=index;c.width=img.width;c.height=img.height;draw()};
const cardChoices=__CARDS__;
function cardContent(button,card){if(card.image){const image=document.createElement('img');image.src=card.image;image.alt=card.name;button.append(image)}const name=document.createElement('span');name.textContent=card.name;button.append(name)}
function selectCard(id,apply=false){const card=cardChoices.find(c=>c.id===id);if(!card)return;el('card').value=id;const button=el('selected-card');button.replaceChildren();cardContent(button,card);const hint=document.createElement('small');hint.textContent='点击更换';button.append(hint);el('card-dialog').close();if(apply){const unit=rows[index].units.find(u=>u.track_id===el('uid').value.trim());if(unit&&unit.card_id!==id){unit.card_id=id;rows[index].reviewed=false;el('reviewed').checked=false;if(loaded===index)draw();el('msg').textContent='已修改当前编号的兵种，请重新核对本帧。'}}}
function showCards(){const query=el('card-search').value.trim().toLowerCase(),grid=el('card-grid');grid.replaceChildren();const choices=cardChoices.filter(c=>[c.name,c.english,c.id].join(' ').toLowerCase().includes(query));el('card-count').textContent=`${choices.length} 个兵种与建筑`;for(const card of choices){const button=document.createElement('button');button.className='card-choice'+(card.id===el('card').value?' selected':'');cardContent(button,card);const kind=document.createElement('small');kind.textContent=card.kind==='building'?'建筑':'兵种';button.append(kind);button.onclick=()=>selectCard(card.id,true);grid.append(button)}}
function openCards(){el('card-search').value='';showCards();el('card-dialog').showModal();el('card-search').focus()}
selectCard(el('card').value);
function draw(){ctx.drawImage(img,0,0);for(const u of rows[index].units){const b=u.bbox;ctx.strokeStyle=u.side===-1?'#dc3545':'#2874d5';ctx.lineWidth=3;ctx.strokeRect(b[0]*c.width,b[1]*c.height,(b[2]-b[0])*c.width,(b[3]-b[1])*c.height);ctx.fillStyle=ctx.strokeStyle;ctx.fillText(u.track_id+' '+u.card_id,b[0]*c.width,Math.max(12,b[1]*c.height-4))}el('units').textContent=JSON.stringify(rows[index].units,null,2)}
function move(step){index=Math.max(0,Math.min(rows.length-1,index+step));loaded=-1;start=null;el('info').textContent=`${index+1}/${rows.length} · ${rows[index].battle} · ${rows[index].split}`;el('reviewed').checked=rows[index].reviewed;img.src=rows[index].preview}
function point(e){const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
c.onpointerdown=e=>{if(loaded!==index)return;start=point(e);c.setPointerCapture(e.pointerId)};
c.onpointerup=e=>{if(!start||loaded!==index)return;const end=point(e),box=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])];start=null;const id=el('uid').value.trim(),card=el('card').value.trim();if(!id||!card||box[2]-box[0]<.01||box[3]-box[1]<.01)return;rows[index].units=rows[index].units.filter(u=>u.track_id!==id);rows[index].units.push({track_id:id,card_id:card,side:Number(el('side').value),bbox:box});rows[index].reviewed=false;el('reviewed').checked=false;draw()};
function clearUnits(){rows[index].units=[];rows[index].reviewed=false;el('reviewed').checked=false;draw()}
function copyPrevious(){if(index===0||rows[index-1].battle!==rows[index].battle){el('msg').textContent='新对局请重新标注';return}rows[index].units=JSON.parse(JSON.stringify(rows[index-1].units));rows[index].reviewed=false;el('reviewed').checked=false;draw();el('msg').textContent='已复制编号与框，请按当前身体位置修正，再确认。'}
function download(){const text=rows.map(({preview,...row})=>JSON.stringify(row)).join('\n')+'\n';const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));link.download='tracking-annotations.jsonl';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);el('msg').textContent='已导出。未确认帧会被训练入口拒绝；保存后可继续加载标注。'}
async function restore(input){const saved=(await input.files[0].text()).trim().split('\n').map(JSON.parse);for(const row of rows){const old=saved.find(x=>x.image===row.image&&x.battle===row.battle&&x.at===row.at);if(old){row.units=old.units;row.reviewed=old.reviewed===true}}move(0)}move(0);</script></html>
